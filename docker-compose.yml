version: '3.9'
services:

  db: 
    image: postgres:16-alpine
    container_name: yorum_analizi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres # kullanıcı adı
      POSTGRES_PASSWORD: postgres # şifre
      POSTGRES_DB: yorum_analizi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: yorum_analizi_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
  
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yorum_analizi_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    ports: 
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
  
volumes:
  postgres_data: 


